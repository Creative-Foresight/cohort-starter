name: Cohort Build
on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      brief_url:
        required: true
        type: string
      # legacy, ignored — runner authenticates via OIDC
      brief_token:
        required: false
        type: string
      cohort_base_url:
        required: true
        type: string

# The runner never pushes code — Cohort opens the PR after deterministic
# checks. Do NOT widen these permissions; the build lane depends on them.
# Only the brief and report jobs may mint cohort-builds OIDC tokens (each
# grants itself id-token: write). The coding engine runs in its own job
# without it, so it can never authenticate to Cohort as this build.
permissions:
  contents: read

concurrency: cohort-build-${{ inputs.build_id }}

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch build brief
        env:
          BRIEF_URL: ${{ inputs.brief_url }}
        run: |
          # Audit H8: fail fast on non-https brief URLs before any network call.
          if [[ "${BRIEF_URL,,}" != https://* ]]; then
            echo "::error::brief_url must start with https://"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cohort-brief"
          OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cohort-builds" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          curl -sf -H "Authorization: Bearer $OIDC_TOKEN" "$BRIEF_URL" -o "$RUNNER_TEMP/brief.json"
          python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['brief'])" "$RUNNER_TEMP/brief.json" > "$RUNNER_TEMP/cohort-brief/brief.md"
          echo "Brief fetched ($(wc -c < "$RUNNER_TEMP/cohort-brief/brief.md") bytes)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cohort-brief
          path: ${{ runner.temp }}/cohort-brief/brief.md
          retention-days: 1
          if-no-files-found: error

  build:
    needs: brief
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No OIDC permission here (see the workflow-level note): nothing in this job can
    # authenticate to Cohort.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cohort-brief
          path: /tmp/cohort-brief

      - name: Run coding engine
        env:
          # The engine signs in with a ChatGPT account (Codex's subscription
          # sign-in), never an OpenAI API key: usage is capped by the plan
          # instead of billed per token. The secret holds the auth.json that
          # `codex login --device-auth` writes (see the Cohort docs).
          CODEX_AUTH_JSON: ${{ secrets.COHORT_BUILD_CODEX_AUTH_JSON }}
          # Repo-configurable build command (audit H8: passed via env, never
          # interpolated into the script body).
          BUILD_COMMAND: ${{ vars.COHORT_BUILD_COMMAND || 'codex exec --dangerously-bypass-approvals-and-sandbox --output-last-message /tmp/engine-summary.md "$(cat /tmp/brief.md)"' }}
        run: |
          cp /tmp/cohort-brief/brief.md /tmp/brief.md
          # No API-key path exists: drop every variable Codex would read as an
          # API key or alternative login before anything runs.
          unset OPENAI_API_KEY CODEX_API_KEY CODEX_ACCESS_TOKEN OPENAI_IDENTITY_TOKEN_FILE OPENAI_FEDERATION_RULE_ID OPENAI_WORKLOAD_IDENTITY_CONTEXT
          export CODEX_HOME="$HOME/.codex"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          # Validate the sign-in and write auth.json (0600). Fails with a
          # readable reason if the secret is missing, is not a ChatGPT
          # sign-in, or expires before this job could finish.
          python3 - <<'PYEOF'
          import base64, hashlib, json, os, sys, time

          SECRET = "COHORT_BUILD_CODEX_AUTH_JSON"
          FIX = ("Sign in again on a trusted machine and replace the secret: "
                 "see Coding in the Cloud > Codex sign-in in the Cohort docs.")

          def fail(reason):
              print(f"::error::{SECRET}: {reason} {FIX}")
              sys.exit(1)

          raw = os.environ.get("CODEX_AUTH_JSON", "").strip()
          if not raw:
              fail("repository secret is missing or empty.")
          try:
              auth = json.loads(raw)
          except ValueError:
              fail("is not valid JSON (it must be the whole auth.json file).")
          if not isinstance(auth, dict) or auth.get("auth_mode") != "chatgpt":
              fail("is not a ChatGPT sign-in (auth_mode must be chatgpt; API-key logins are refused).")
          tokens = auth.get("tokens") or {}
          if not tokens.get("access_token") or not tokens.get("refresh_token"):
              fail("has no ChatGPT tokens.")
          try:
              payload = tokens["access_token"].split(".")[1]
              payload += "=" * (-len(payload) % 4)
              expires = int(json.loads(base64.urlsafe_b64decode(payload))["exp"])
          except Exception:
              fail("access token is unreadable.")
          hours_left = (expires - time.time()) / 3600
          # Stay clear of Codex's refresh window for the whole 45-minute job:
          # every run shares this one sign-in, and a refresh rotates the
          # refresh token that the other runs still hold.
          if hours_left < 1:
              fail("sign-in has expired or expires within the hour.")
          if hours_left < 48:
              print(f"::warning::{SECRET} expires in {hours_left:.0f} hours. {FIX}")
          # Belt and braces: never carry an API key, even an unused one.
          auth["OPENAI_API_KEY"] = None
          path = os.path.join(os.environ["CODEX_HOME"], "auth.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump(auth, f)
          os.chmod(path, 0o600)
          digest = hashlib.sha256(tokens["refresh_token"].encode()).hexdigest()
          with open(os.path.join(os.environ["RUNNER_TEMP"], "codex-refresh.sha256"), "w") as f:
              f.write(digest)
          print(f"ChatGPT sign-in loaded ({hours_left:.0f} hours left).")
          PYEOF
          unset CODEX_AUTH_JSON
          # ChatGPT sign-in only (Codex refuses and logs out any API-key auth),
          # file-based credentials, and a model every ChatGPT plan includes.
          printf '%s\n' 'forced_login_method = "chatgpt"' 'cli_auth_credentials_store = "file"' 'model = "gpt-6-astra"' > "$CODEX_HOME/config.toml"
          # Exact version, no install scripts (audit S-67).
          npm install -g --ignore-scripts @openai/codex@0.155.1
          if ! codex login status 2>&1 | grep -qx "Logged in using ChatGPT"; then
            echo "::error::Codex is not signed in with ChatGPT; refusing to run the engine."
            exit 1
          fi
          # Codex's own bubblewrap sandbox cannot start inside Actions runners
          # (bwrap loopback needs caps the runner doesn't grant). The ephemeral
          # runner VM with a read-only GITHUB_TOKEN is the sandbox here.
          # Audit H8 (2026-08-22): the --dangerously-bypass-approvals-and-sandbox
          # default stays deliberately — the runner itself is the confinement
          # boundary (ephemeral VM, read-only token, no repo write access, no
          # OIDC, secrets limited to the engine's sign-in). Replacing this flag
          # needs runner-level sandboxing work; revisit before syncing this
          # template into long-lived or self-hosted runner contexts.
          # Execute the configured command verbatim (audit H8: env-mediated).
          eval "$BUILD_COMMAND"

      - name: Check the sign-in was not rotated
        if: always()
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os
          before = os.path.join(os.environ["RUNNER_TEMP"], "codex-refresh.sha256")
          after = os.path.join(os.path.expanduser("~"), ".codex", "auth.json")
          if os.path.exists(before) and os.path.exists(after):
              token = (json.load(open(after)).get("tokens") or {}).get("refresh_token") or ""
              if hashlib.sha256(token.encode()).hexdigest() != open(before).read().strip():
                  print("::warning::Codex refreshed the ChatGPT sign-in during this run, so the "
                        "refresh token in COHORT_BUILD_CODEX_AUTH_JSON is now spent. Builds keep "
                        "working until its access token expires; replace the secret before then.")
          PYEOF

      - name: Collect changed files
        run: |
          mkdir -p /tmp/cohort-report
          python3 - <<'PYEOF'
          import json, os, subprocess

          status = subprocess.run(
              ["git", "status", "--porcelain"], capture_output=True, text=True, check=True
          ).stdout.splitlines()
          files = []
          for line in status:
              code, path = line[:2], line[3:].strip()
              if path.startswith('"') and path.endswith('"'):
                  path = json.loads(path)
              if "D" in code:
                  print(f"skip (deletion unsupported in v1): {path}")
                  continue
              if not os.path.isfile(path):
                  continue
              try:
                  with open(path, encoding="utf-8") as f:
                      files.append({"path": path, "content": f.read()})
              except UnicodeDecodeError:
                  print(f"skip (binary): {path}")

          summary = open("/tmp/brief.md", encoding="utf-8").read().strip().splitlines()[0][:200] or "Cohort build"
          if not files:
              # No change: send the engine's own explanation so Cohort records
              # WHY on the build instead of timing it out.
              try:
                  explanation = open("/tmp/engine-summary.md", encoding="utf-8").read().strip()
              except OSError:
                  explanation = ""
              summary = explanation or "The coding engine finished without changing any files."
              print("No changed files produced by the engine; reporting that to Cohort.")
          with open("/tmp/cohort-report/report.json", "w", encoding="utf-8") as f:
              json.dump({"summary": summary, "files": files}, f)
          print(f"Collected {len(files)} changed file(s).")
          PYEOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cohort-report
          path: /tmp/cohort-report/report.json
          retention-days: 1
          if-no-files-found: error

  report:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cohort-report
          path: ${{ runner.temp }}/cohort-report

      - name: Report changed files to Cohort
        env:
          COHORT_BASE_URL: ${{ inputs.cohort_base_url }}
          BUILD_ID: ${{ inputs.build_id }}
          REPORT_PATH: ${{ runner.temp }}/cohort-report/report.json
        run: |
          # Audit H8: build_id is spliced into a URL path below — constrain it.
          if ! printf '%s' "$BUILD_ID" | grep -qE '^[A-Za-z0-9-]+$'; then
            echo "::error::build_id contains characters outside [A-Za-z0-9-]"
            exit 1
          fi
          export COHORT_BASE_URL BUILD_ID REPORT_PATH
          OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cohort-builds" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          export OIDC_TOKEN
          python3 - <<'PYEOF'
          import json, os, sys, urllib.error, urllib.request

          with open(os.environ["REPORT_PATH"], "rb") as f:
              body = f.read()
          changed = len(json.loads(body).get("files") or [])
          report_url = (
              os.environ["COHORT_BASE_URL"].rstrip("/")
              + "/api/v1/builds/"
              + os.environ["BUILD_ID"]
              + "/report"
          )
          req = urllib.request.Request(
              report_url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['OIDC_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  print(f"report accepted: HTTP {res.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:2000]
              if changed == 0 and error.code == 400:
                  print("::error::The coding engine changed no files; Cohort recorded its explanation on the build.")
              else:
                  print(f"::error::Cohort did not accept this build's report (HTTP {error.code}): {detail}")
              sys.exit(1)
          except urllib.error.URLError as error:
              print(f"::error::Could not reach Cohort to report this build: {error.reason}")
              sys.exit(1)
          PYEOF
